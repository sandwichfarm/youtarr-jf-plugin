# Jellyfin 10.11.11 load-test harness for the Youtarr metadata plugin.
#
# All paths are relative to THIS file's directory so the harness is portable
# (run `docker compose up -d` from test/jellyfin-load-test/).
#
# Volume layout:
#   ${YOUTARR_TEST_CONFIG_DIR:-./config} -> /config
#   ${YOUTARR_TEST_CACHE_DIR:-./cache}   -> /cache
#   ${YOUTARR_TEST_PLUGIN_DIR:-./plugins} -> /config/plugins
#   ./media   -> /media:ro        fixture library, mounted READ-ONLY so the
#                                 plugin can never mutate user media (T-01-07)
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin-plugin-test
    ports:
      - "8096:8096"
    volumes:
      - ${YOUTARR_TEST_CONFIG_DIR:-./config}:/config
      - ${YOUTARR_TEST_CACHE_DIR:-./cache}:/cache
      - ${YOUTARR_TEST_PLUGIN_DIR:-./plugins}:/config/plugins
      - ./media:/media:ro
    environment:
      - JELLYFIN_DATA_DIR=/config
      - JELLYFIN_CACHE_DIR=/cache
    # Disposable test container: do not auto-restart. If the plugin
    # Malfunctions and destabilizes the server, the container just stops (T-01-08).
    restart: "no"
